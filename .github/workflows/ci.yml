name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Every backend run - on any branch, from any PR - shares one Neon test
    # branch (PB_TRACKER_EXPECTED_BRANCH_ID below), whose only isolation is
    # truncateAll() between tests. Two overlapping runs therefore delete each
    # other's rows mid-test, which shows up as unrelated tests failing at
    # random. The group is deliberately a fixed string rather than the usual
    # github.ref, so runs from *different* branches serialize too; and
    # cancel-in-progress stays false so a queued run waits its turn instead of
    # killing a run that is mid-write. Remove this once each run provisions its
    # own ephemeral Neon branch.
    concurrency:
      group: shared-neon-test-db
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend-hono
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-hono/package-lock.json
      - run: npm ci
      - run: npm run db:migrate:test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          PB_TRACKER_DATABASE_ROLE: destructive-test
          PB_TRACKER_EXPECTED_PROJECT_ID: dry-tooth-70023755
          PB_TRACKER_EXPECTED_BRANCH_ID: br-soft-field-afjdtpjs
      - run: npm run typecheck
      - run: bash ../scripts/test-refresh-neon-standby.sh
      - run: npm test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          PB_TRACKER_DATABASE_ROLE: destructive-test
          PB_TRACKER_EXPECTED_PROJECT_ID: dry-tooth-70023755
          PB_TRACKER_EXPECTED_BRANCH_ID: br-soft-field-afjdtpjs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
